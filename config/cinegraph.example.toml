[data]
root = ".data"

[sqlite]
path = ".data/db/cinegraph.sqlite"
max_connections = 4

[logging]
level = "info"
format = "pretty"
file = ".data/logs/cinegraph.log"

[graph]
base_iri = "https://cinegraph.local/"

[fetch]
user_agent = "cinegraph/0.1.0 academic-local-cache"
connect_timeout_seconds = 30
request_timeout_seconds = 600
retries = 3

[sources.imdb]
enabled = true
base_url = "https://datasets.imdbws.com/"
datasets = [
  "name.basics.tsv.gz",
  "title.akas.tsv.gz",
  "title.basics.tsv.gz",
  "title.crew.tsv.gz",
  "title.episode.tsv.gz",
  "title.principals.tsv.gz",
  "title.ratings.tsv.gz",
]

[sources.tmdb]
enabled = false
export_base_url = "https://files.tmdb.org/p/exports/"
api_base_url = "https://api.themoviedb.org/3"
api_read_access_token = ""
language = "en-US"
hydrate_limit_per_run = 25
request_interval_ms = 250
export_days_back = 2
include_adult = false
